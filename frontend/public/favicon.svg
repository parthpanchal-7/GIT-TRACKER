  <g fill="none" stroke="#BFF549" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer G Loop -->
    <path d="M 68 32 A 38 38 0 1 0 74 60 L 52 60" stroke-width="7"/>
    <!-- Middle Concentric Arc Track -->
    <path d="M 50 24 A 26 26 0 1 0 68 50 L 50 50" stroke-width="6.5"/>
